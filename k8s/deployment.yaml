apiVersion: apps/v1
kind: Deployment
metadata:
  name: mp181-api
  labels:
    app: mp181-api
spec:
  replicas: 3
  selector:
    matchLabels:
      app: mp181-api
  template:
    metadata:
      labels:
        app: mp181-api
    spec:
      containers:
      - name: mp181-api
        image: mp181-api:1.0
        ports:
        - containerPort: 8000
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 15
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 5
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "500m"
            memory: "512Mi"
